<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlatoX - Community Leaders</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #2b2d35;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --accent-color: #848991;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --glass-bg: rgba(20, 20, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-color: #848991;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Cairo', 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
            overflow-x: hidden;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.15);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo h1 { margin: 0; font-family: 'Poppins', sans-serif; font-weight: 700; }
        .logo span { color: var(--accent-color); }
        
        .nav-controls i {
            font-size: 1.2rem;
            margin: 0 10px;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .lang-switch { margin-right: 15px; }
        .lang-switch button {
            background: none; border: none; color: var(--accent-color);
            font-weight: bold; cursor: pointer; font-family: inherit;
        }
        .lang-switch button.active { color: var(--text-color); border-bottom: 2px solid var(--text-color); }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2 { text-align: center; font-weight: 700; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }

        .server-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        
        .server-tab {
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid rgba(132, 137, 145, 0.4);
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        
        .server-tab:hover {
            border-color: var(--text-color);
        }
        
        .server-tab.active {
            background: var(--text-color);
            color: var(--bg-color);
            border-color: var(--text-color);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .global-leader {
            text-align: center;
            padding: 15px;
            display: none;
        }
        
        /* كلاس للقادة العرب ليكون ظاهر دائماً */
        .static-leader {
            display: block !important;
        }

        .global-leader img, .static-leader img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid var(--glass-border);
        }

        .num-font { font-family: 'Poppins', sans-serif; font-weight: 600; margin: 0; font-size: 1rem; }

        .tournament-card { margin-bottom: 20px; }
        .tour-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .tour-tag { padding: 5px 15px; border-radius: 10px; font-weight: bold; }
        .tour-tag.y1 { background: #facc15; color: #000; }
        .tour-tag.y2 { background: #38bdf8; color: #000; }
        .timer { padding: 5px 10px; border-radius: 8px; background: rgba(239, 68, 68, 0.2); color: #ef4444; font-weight: bold; font-family: monospace; }
        .tour-details div { background: rgba(128,128,128,0.1); padding: 10px; border-radius: 8px; margin-bottom: 8px; text-align: center; font-weight: bold; }
        .prize-gold { color: #d97706; }

        @keyframes fadeScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .aos-animate { animation: fadeScale 0.6s ease-out forwards; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h1>Plato<span>X</span></h1>
        </div>
        <div class="nav-controls">
            <span class="lang-switch">
                <button id="btn-ar" onclick="changeLang('ar')" class="active">AR</button>
                <button id="btn-en" onclick="changeLang('en')">EN</button>
            </span>
            <i id="theme-icon" class="fa-solid fa-moon theme-toggle" onclick="toggleTheme()"></i>
            <i class="fa-brands fa-discord"></i>
            <i class="fa-brands fa-instagram"></i>
        </div>
    </header>

    <div class="container" id="content">
        
        <!-- 1. Community News Board -->
        <section id="news-board" class="glass-panel" data-aos="fade-up">
            <h2 data-i18n="news_title">LATEST PLATO NEWS</h2>
            <p id="news-text" style="text-align: center; font-weight: 600;"></p>
        </section>

        <!-- 2. Arabic Leaders -->
        <section id="arabic-leaders" class="glass-panel" data-aos="fade-up">
            <h2 data-i18n="arabic_leaders">ARABIC LEADERS</h2>
            <div class="grid-container">
                <div class="global-leader static-leader glass-panel">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=848991&color=fff&bold=true" alt="Admin">
                    <h3 class="num-font">Admin</h3>
                </div>
                <!-- يمكنك إضافة المزيد من القادة العرب هنا مستقبلاً -->
            </div>
        </section>

        <!-- 3. Global Servers Leaders -->
        <section id="global-leaders" class="glass-panel" data-aos="fade-up">
            <h2 data-i18n="global_leaders">GLOBAL SERVERS LEADERS</h2>
            
            <div class="server-tabs">
                <button class="server-tab active" data-target="brazil" onclick="filterServer('brazil')">Brazil</button>
                <button class="server-tab" data-target="desi" onclick="filterServer('desi')">Desi</button>
                <button class="server-tab" data-target="english" onclick="filterServer('english')">English</button>
                <button class="server-tab" data-target="french" onclick="filterServer('french')">French</button>
                <button class="server-tab" data-target="melayu" onclick="filterServer('melayu')">Melayu</button>
                <button class="server-tab" data-target="persian" onclick="filterServer('persian')">Persian</button>
                <button class="server-tab" data-target="spanish" onclick="filterServer('spanish')">Spanish</button>
                <button class="server-tab" data-target="thai" onclick="filterServer('thai')">Thai</button>
                <button class="server-tab" data-target="turkish" onclick="filterServer('turkish')">Turkish</button>
            </div>

            <div class="grid-container" id="global-leaders-grid">
                <!-- Javascript will render leaders here -->
            </div>
        </section>

        <!-- 4. Approved Tournaments -->
        <section id="tournaments-section" data-aos="fade-up">
            <h2 data-i18n="tournaments">APPROVED TOURNAMENTS</h2>
            <div id="tournaments-container">
                <!-- Javascript will render tournaments here -->
            </div>
        </section>

        <!-- 5. Top Spending Groups -->
        <section id="top-spending" class="glass-panel" data-aos="fade-up">
            <h2 data-i18n="top_spending">TOP SPENDING GROUPS</h2>
            <div style="text-align:center;">
                <p data-i18n="coming_soon" style="font-weight: 600; opacity: 0.8;">Coming Soon...</p>
            </div>
        </section>

        <!-- 6. Oldest Players -->
        <section id="oldest-players" class="glass-panel" data-aos="fade-up">
            <h2 data-i18n="oldest_players">OLDEST PLAYERS</h2>
            <div style="text-align:center;">
                <p data-i18n="coming_soon" style="font-weight: 600; opacity: 0.8;">Coming Soon...</p>
            </div>
        </section>

    </div>

    <script>
        const translations = {
            ar: {
                news_title: "آخر أخبار بلاتو",
                news_text: "سيتم مسح المتجر بالكامل قريباً، استعد للتحديثات القادمة!",
                arabic_leaders: "القادة العرب",
                global_leaders: "قادة السيرفرات العالمية",
                tournaments: "البطولات المعتمدة",
                top_spending: "أكثر المجموعات إنفاقاً",
                oldest_players: "أقدم اللاعبين",
                coming_soon: "قريباً...",
                tour_1_title: "بطولة يوسف 1", 
                tour_1_desc: "مجموعة يوسف الاولى ترحب بكم في بطولة بلياردو الليلة الساعة ٩ بتوقيت السعودية بجوائز للمركز الاولى ٥٠ك للمركز الثاني ٣٠ك للدخول الى القروب يرجى نسخ يوزر الاداري واضافته على بلاتو",
                tour_2_title: "بطولة يوسف 2", 
                tour_2_desc: "ندعوكم للمشاركة في تحدي ذئاب (Werewolf) الليلة الساعة 10 بتوقيت السعودية. الأماكن محدودة.",
                game_pool: "بلياردو", 
                game_werewolf: "ذئاب (Werewolf)"
            },
            en: {
                news_title: "LATEST PLATO NEWS",
                news_text: "The store will be completely cleared soon, get ready for updates!",
                arabic_leaders: "ARABIC LEADERS",
                global_leaders: "GLOBAL SERVERS LEADERS",
                tournaments: "APPROVED TOURNAMENTS",
                top_spending: "TOP SPENDING GROUPS",
                oldest_players: "OLDEST PLAYERS",
                coming_soon: "Coming Soon...",
                tour_1_title: "Youssef Tournament 1", 
                tour_1_desc: "Youssef's first group welcomes you to a Pool tournament tonight at 9 KSA time. Prizes: 1st 50k, 2nd 30k. To join, copy the admin's username and add on Plato.",
                tour_2_title: "Youssef Tournament 2", 
                tour_2_desc: "We invite you to participate in the Werewolf challenge tonight at 10 KSA time. Seats are limited.",
                game_pool: "Pool", 
                game_werewolf: "Werewolf"
            }
        };

        const globalLeadersData = [
            // 1. Brazil
            { name: "morango", server: "brazil", color: "22c55e", img: "morango.webp" }, 
            { name: "vsf", server: "brazil", color: "22c55e", img: "vsf.webp" },
            
            // 2. Desi
            { name: "Frequency", server: "desi", color: "d97706", img: "frequency.webp" },
            
            // 3. English
            { name: "Fear", server: "english", color: "0a2a75", img: "fear.webp" }, 
            { name: "abc", server: "english", color: "0a2a75", img: "abc.webp" }, 
            { name: "Rose", server: "english", color: "0a2a75", img: "rose.webp" }, 
            { name: "Risk", server: "english", color: "0a2a75", img: "risk.webp" },
            
            // 4. French
            { name: "H22", server: "french", color: "3b82f6", img: "h22.webp" }, 
            { name: "love_hope", server: "french", color: "3b82f6", img: "love_hope.webp" }, 
            { name: "Mdame", server: "french", color: "3b82f6", img: "mdame.webp" }, 
            { name: "Algerien", server: "french", color: "3b82f6", img: "algerien.webp" },
            
            // 5. Melayu
            { name: "Fyy", server: "melayu", color: "8b5cf6", img: "fyy.webp" }, 
            { name: "Lyn", server: "melayu", color: "8b5cf6", img: "lyn.webp" }, 
            { name: "abo", server: "melayu", color: "8b5cf6", img: "abo.webp" },
            
            // 6. Persian
            { name: "7777777", server: "persian", color: "10b981", img: "7777777.webp" }, 
            { name: "Armin", server: "persian", color: "10b981", img: "armin.webp" }, 
            { name: "Reza", server: "persian", color: "10b981", img: "reza.webp" }, 
            { name: "NarGc", server: "persian", color: "10b981", img: "nargc.webp" },
            
            // 7. Spanish
            { name: "Marito", server: "spanish", color: "f59e0b", img: "marito.webp" }, 
            { name: "kroxtar", server: "spanish", color: "f59e0b", img: "kroxtar.webp" },
            
            // 8. Thai
            { name: "sroti", server: "thai", color: "ec4899", img: "sroti.webp" }, 
            { name: "nrasl", server: "thai", color: "ec4899", img: "nrasl.webp" },
            
            // 9. Turkish
            { name: "Nefya", server: "turkish", color: "ef4444", img: "nefya.webp" }, 
            { name: "esthell", server: "turkish", color: "ef4444", img: "esthell.webp" }
        ];

        function renderGlobalLeaders() {
            const container = document.getElementById('global-leaders-grid');
            container.innerHTML = '';
            globalLeadersData.forEach(leader => {
                const imageSource = leader.img ? leader.img : `https://ui-avatars.com/api/?name=${leader.name}&background=${leader.color}&color=fff&bold=true`;
                
                container.innerHTML += `
                    <div class="global-leader glass-panel" data-server="${leader.server}">
                        <img src="${imageSource}" alt="${leader.name}">
                        <h3 class="num-font">${leader.name}</h3>
                    </div>
                `;
            });
        }

        function filterServer(serverName) {
            document.querySelectorAll('.server-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.target === serverName);
            });
            
            document.querySelectorAll('#global-leaders-grid .global-leader').forEach(card => {
                if(card.dataset.server === serverName) {
                    card.style.display = 'block';
                    card.style.animation = 'none'; 
                    
                    setTimeout(() => {
                        card.style.animation = 'fadeScale 0.4s ease-out forwards';
                    }, 10);
                    
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function renderTournaments() {
            const container = document.getElementById('tournaments-container');
            container.innerHTML = `
                <div class="glass-panel tournament-card">
                    <div class="tour-header">
                        <span class="tour-tag y1">Y1</span>
                        <span class="timer"><i class="fa-regular fa-clock"></i> 21:00</span>
                    </div>
                    <h3 data-i18n="tour_1_title" style="text-align: center; margin-top:0;">...</h3>
                    <p data-i18n="tour_1_desc" style="text-align: center; font-size: 0.9rem;">...</p>
                    <div class="tour-details">
                        <div><i class="fa-solid fa-gamepad"></i> <span data-i18n="game_pool">...</span></div>
                        <div class="prize-gold"><i class="fa-solid fa-trophy"></i> 50K - 30K</div>
                    </div>
                </div>

                <div class="glass-panel tournament-card">
                    <div class="tour-header">
                        <span class="tour-tag y2">Y2</span>
                        <span class="timer"><i class="fa-regular fa-clock"></i> 22:00</span>
                    </div>
                    <h3 data-i18n="tour_2_title" style="text-align: center; margin-top:0;">...</h3>
                    <p data-i18n="tour_2_desc" style="text-align: center; font-size: 0.9rem;">...</p>
                    <div class="tour-details">
                        <div><i class="fa-solid fa-gamepad"></i> <span data-i18n="game_werewolf">...</span></div>
                    </div>
                </div>
            `;
        }

        function changeLang(lang) {
            document.documentElement.setAttribute('lang', lang); 
            document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            
            document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            
            renderTournaments(); 
            
            document.querySelectorAll('[data-i18n]').forEach(el => { 
                const key = el.getAttribute('data-i18n');
                if(translations[lang][key]) el.innerText = translations[lang][key]; 
            });
            
            document.getElementById('news-text').innerText = translations[lang]['news_text'];
            
            localStorage.setItem('lang', lang);
            
            const animatedElements = document.querySelectorAll('[data-aos]');
            animatedElements.forEach(el => { el.classList.remove('aos-animate'); void el.offsetWidth; });
            setTimeout(() => { animatedElements.forEach(el => el.classList.add('aos-animate')); }, 50);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            document.getElementById('theme-icon').className = target === 'light' ? 'fa-solid fa-sun theme-toggle' : 'fa-solid fa-moon theme-toggle';
            localStorage.setItem('theme', target);
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('theme') || 'dark'; 
            document.documentElement.setAttribute('data-theme', savedTheme); 
            document.getElementById('theme-icon').className = savedTheme === 'light' ? 'fa-solid fa-sun theme-toggle' : 'fa-solid fa-moon theme-toggle';
            
            renderGlobalLeaders();
            filterServer('brazil'); 
            
            const savedLang = localStorage.getItem('lang') || 'ar'; 
            changeLang(savedLang);
            
            document.querySelectorAll('.glass-panel').forEach(el => el.classList.add('aos-animate'));
        }
    </script>
</body>
</html>
